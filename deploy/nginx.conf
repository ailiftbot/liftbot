# Docker Compose prod nginx — TLS is usually terminated on the host
# (certbot) or a load balancer. This file proxies HTTP inside the compose network.
# For host nginx + Let's Encrypt, use: bash deploy/setup-ssl.sh

upstream liftbot_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name liftbot.app;
    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
    }

    location / {
        proxy_pass http://liftbot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

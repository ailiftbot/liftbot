{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server Error — LiftBot</title>
  <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --p:#7C3AED; }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: #f3f2ee;
      color: #111827;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .err-code {
      font-size: 120px;
      font-weight: 800;
      background: linear-gradient(135deg, #A78BFA, var(--p));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { color: #6B7280; font-size: 15px; max-width: 440px; margin: 0 auto 28px; line-height: 1.6; }
    a.btn {
      display: inline-block;
      background: var(--p);
      color: #fff;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: background 0.2s;
    }
    a.btn:hover { background: #6D28D9; }
  </style>
</head>
<body>
  <div class="err-code">500</div>
  <h1>Something went wrong</h1>
  <p>We ran into an unexpected error. Our team has been notified and we're working on a fix. Please try again in a few moments.</p>
  <a class="btn" href="/">Go to homepage</a>
</body>
</html>

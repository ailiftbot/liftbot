<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}LiftBot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --p:#7C3AED; --pd:#6D28D9; --ink:#111827; --bg:#F3F4F6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 28px; background:#0B1220; color:#fff; }
    .brand { font-weight:800; font-size:18px; color:#fff; text-decoration:none; }
    nav a { color:#D1D5DB; text-decoration:none; margin-left:14px; font-size:13.5px; font-weight:600; }
    nav a.cta { background:var(--p); color:#fff; padding:8px 14px; border-radius:999px; }
    main { max-width:960px; margin:0 auto; padding:28px 20px 48px; }
    .flash { background:#EDE9FE; color:#5B21B6; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'home' %}">LiftBot</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a class="cta" href="{% url 'signup' %}">Start hiring</a>
      {% endif %}
    </nav>
  </header>
  {% if messages %}
  <main style="padding-bottom:0;">
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
  </main>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

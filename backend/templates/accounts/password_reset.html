{% extends 'base.html' %}
{% block title %}Reset password — LiftBot{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border p-8">
  <h1 class="font-display text-2xl mb-4">Reset password</h1>
  <form method="post" class="space-y-4">{% csrf_token %}{{ form.as_p }}<button class="rounded-full bg-brand text-white px-5 py-2">Send reset link</button></form>
</div>
{% endblock %}

# Apache vhost — proxy http://liftbot.brandinglift.com → local LiftBot (gunicorn :8001)
# Enable:
#   sudo cp deploy/apache-liftbot.conf /etc/apache2/sites-available/liftbot.conf
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite liftbot
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName liftbot.brandinglift.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    ErrorLog ${APACHE_LOG_DIR}/liftbot-error.log
    CustomLog ${APACHE_LOG_DIR}/liftbot-access.log combined
</VirtualHost>
